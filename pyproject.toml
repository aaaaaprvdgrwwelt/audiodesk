[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiodesk"
version = "0.1.0"
description = "Ein Dateimanager nur fuer Audio (Musik, Hoerbuecher): sichten, hoeren, Metadaten holen, umbenennen"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Gemeinsames Grundgeruest mit den anderen *desk-Apps (siehe
    # ../deskkit) - noch kein eigenes PyPI-Paket, deshalb per
    # `pip install -r requirements.txt` (editable) statt hier direkt
    # aufloesbar.
    "deskkit",
    "PySide6>=6.6",
    "mutagen>=1.46",
    "requests>=2.31",
    "send2trash>=1.8",
    # API-Schluessel im System-Schluesselbund statt im Klartext in
    # QSettings - siehe deskkit.secrets.
    "keyring>=24",
]

[project.urls]
Homepage = "https://github.com/aaaaaprvdgrwwelt/audiodesk"

[project.scripts]
audiodesk = "audiodesk.__main__:main"

[tool.setuptools.packages.find]
include = ["audiodesk*"]
